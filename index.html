<!DOCTYPE html>
<!-- 文档类型声明：告诉浏览器这是 HTML5 页面 -->
<html lang="zh">
<!-- lang="zh" 表示页面语言是中文 -->

<head>
  <!-- 声明字符编码为 UTF-8，防止中文乱码 -->
  <meta charset="UTF-8">
  <title>DeepSeek 对话测试</title>
  <!-- 标题显示在浏览器标签页上 -->


  
  <style>
    /* ---------- 页面样式 ---------- */
    body {
      width: 800px;      /* 内容区最宽 800px，避免大屏上拉得太长 */
      margin: 30px auto;     /* 上下留 30px，水平居中 */
      font-family: sans-serif;
      color: #333;
      background-color: rgb(251, 252, 249);
    }

    #log {
      /* 对话记录显示区 */
      border: 1px solid #ccc;     /* 浅灰色边框 */
      padding: 16px;              /* 内边距，让文字不贴边 */
      min-height: 400px;          /* 最小高度 200px，没内容时也不至于太扁 */
      border-radius: 4px;
      font-size: 14px;
      overflow-y: auto;           /* 内容超出高度时出现滚动条 */
      height: 80vh;
      background-color: #ffffff;      
    }

    /* ---------- 聊天气泡样式 ---------- */
    .msg {
      display: flex;
      flex-direction: column;     /* 纵向排列：时间和气泡上下两行 */
      align-items: flex-end;      /* 用户消息：整体靠右对齐 */
      margin: 10px 0;             /* 每条消息之间的间距 */
    }
    .msg.ai {
      align-items: flex-start;    /* AI 消息：靠左对齐 */
    }
    .bubble {
      max-width: 70%;             /* 气泡最宽 70%，超出自动换行 */
      padding: 8px 12px;          /* 气泡内边距 */  
      white-space: pre-wrap;      /* 保留换行和空格 */
      word-break: break-word;     /* 长单词/长链接强制换行 */
    }
    .msg.user .bubble {
      background-color: #eef5e7;  /* 用户气泡：浅蓝色 */
      color: #473b21;             /* 深蓝色文字 */ 
      border-radius: 10px 10px 2px 10px;      /* 圆角，气泡感 */     
    }
    .msg.ai .bubble {
      background-color: #f3f3f2;  /* AI 气泡：浅灰色 */
      color: #4b4948;
      border-radius: 10px 10px 10px 2px;      /* 圆角，气泡感 */
    }
    .time {
      font-size: 12px;            /* 时间小一号 */
      color: #999;                /* 灰色 */
      margin-bottom: 6px;         /* 和下方气泡留一点距离 */
      margin-top: 6px;
    }


    /* 输入区：用 flex 让输入框和发送按钮同处一行，且底部对齐 */
    #input-area {
      display: flex;
      align-items: flex-end;    /* 底部对齐 */
      gap: 16px;                   /* 输入框与按钮之间的间距 */
    }
    #input {
      /* 输入框 */
      flex: 1;                    /* 占满剩余宽度，右边留给按钮 */
      padding: 16px;  
      border-radius: 4px;
      border: 1px solid #ccc; 
      overflow-y: auto;           /* 内容超出高度时出现滚动条 */
      min-height: 5vh;
      box-sizing: border-box;     /* padding 计入宽度，避免撑破布局 */
    }
    button {
      /* 发送按钮 */
      height: 32px;
      padding: 0 16px;
      border-radius: 4px;
      color: #fdfdfd;
      border: 1px solid #0f76d6; 
      background-color: rgb(77, 181, 241);      
      flex-shrink: 0;             /* 按钮不被压缩 */
    }
  </style>
</head>                                      



<body>
    <!-- 对话记录显示区：对话会以气泡形式追加到这里 -->
  <div id="log"></div>
 <br>
   <!-- 用户输入框：textarea 支持多行输入，必须有闭合标签 </textarea> -->
  <div id="input-area">
    <!-- 用户输入框：textarea 支持多行输入，必须有闭合标签 </textarea> -->
    <textarea id="input" placeholder="输入内容...（Enter 发送，Shift+Enter 换行）"></textarea>
    <!-- 发送按钮：点击时调用下方 script 里定义的 send() 函数 -->
    <button onclick="send()">发送</button>
  </div>
 


  <script>
    // ---------- 核心逻辑 ----------

    // 对话历史数组：每项形如 { role: "user"|"assistant", content: "文本" }
    // 每次发消息时连同新输入一起发给后端，AI 才能记住之前聊了什么
    // 注意：只存在内存里，刷新页面就清空
    const messages = [];           // 保存对话历史（发给后端）

    /**
     * 获取当前时间的字符串，格式 HH:MM:SS（24 小时制）
     */
    function nowTime() {
      return new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    /**
     * 在对话区追加一条气泡消息
     * @param {string} role  - "user"（右对齐蓝色气泡）或 "ai"（左对齐灰色气泡）
     * @param {string} text  - 消息内容
     * @param {string} time  - 显示的时间字符串
     * @returns {HTMLElement} 气泡元素（AI 的"思考中..."占位要用它来更新文字）
     */
    function addBubble(role, text, time) {
      const log = document.getElementById("log");

      // 外层容器：负责左右对齐
      const row = document.createElement("div");
      row.className = "msg " + role;

      // 时间标签：单独一行，显示在气泡上方
      const timeEl = document.createElement("span");
      timeEl.className = "time";
      timeEl.textContent = time;

      // 气泡本体
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      // 时间在上、气泡在下（对齐方向由 CSS 的 align-items 控制）    
      row.appendChild(bubble);
      row.appendChild(timeEl);

      log.appendChild(row);
      log.scrollTop = log.scrollHeight; // 自动滚动到底部，看到最新消息
      return bubble;
    }

    /**
     * 发送消息的主函数
     * 由"发送"按钮的 onclick 和输入框的回车键触发
     */
    async function send() {
      // 获取页面上的输入框（textarea 支持多行输入）
      const textarea = document.getElementById("input");

      // 取出输入内容并去掉首尾空格
      const text = textarea.value.trim();
      if (!text) return;        // 空内容直接返回，不发请求
      textarea.value = "";      // 清空输入框，方便继续输入

      // 1. 把用户的话以"蓝色右对齐气泡 + 时间"显示，并加入历史数组
      addBubble("user", text, nowTime());
      messages.push({ role: "user", content: text });

      // 2. 先显示"思考中..."占位气泡，等 AI 回来再更新它的文字
      const pending = addBubble("ai", "思考中...", nowTime());

      try {
        // 3. 把输入和历史发给本地后端 server.js（后端再转发给 DeepSeek）
        //    history 用 slice(0, -1) 是去掉刚 push 的那条，
        //    因为后端会自己把 message 拼到 history 末尾，避免重复
        const res = await fetch("http://localhost:3001/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },   // 告诉后端发的是 JSON
          body: JSON.stringify({ message: text, history: messages.slice(0, -1) })
        });

        // 4. 解析后端返回的 JSON，格式为 { reply: "AI 回复" } 或 { error: "错误信息" }
        const data = await res.json();
        // 把占位气泡的文字替换为真实回复
        pending.textContent = data.reply || ("出错: " + data.error);

        // 5. AI 的回复也加入历史数组，下一轮 AI 才知道自己说过什么
        if (data.reply) messages.push({ role: "assistant", content: data.reply });
      } catch (e) {
        // 请求失败（最常见原因：server.js 没启动）
        pending.textContent = "请求失败，请确认 server.js 已启动";
      }
    }

    // 快捷键发送：Enter 发送消息，Shift+Enter 换行（textarea 多行输入必备）
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault(); // 阻止 Enter 默认的换行行为
        send();
      }
    });

    /**
     * 页面打开时自动加载历史聊天记录
     * 从后端的 /history 接口读取 chat_log.json 的内容：
     *   1. 把每条"我: / AI:"显示到对话区
     *   2. 同时恢复到 messages 数组，AI 能接着之前的上下文继续聊
     */
    async function loadHistory() {
      try {
        const res = await fetch("http://localhost:3001/history");
        const logs = await res.json();          // 格式：[{ time, user, assistant }, ...]
        for (const item of logs) {
          // 用气泡样式显示历史记录（item.time 是后端记录的对话时间）
          addBubble("user", item.user, item.time);
          addBubble("ai", item.assistant, item.time);
          // 恢复对话上下文（用户一句 + AI 一句）
          messages.push({ role: "user", content: item.user });
          messages.push({ role: "assistant", content: item.assistant });
        }
      } catch (e) {
        // 后端没启动时静默忽略，不影响正常使用
      }
    }
    loadHistory(); // 页面脚本加载完就立刻执行
  </script>
</body>

</html>
