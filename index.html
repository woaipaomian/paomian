<!DOCTYPE html>
<!-- 文档类型声明：告诉浏览器这是 HTML5 页面 -->
<html lang="zh">
<!-- lang="zh" 表示页面语言是中文 -->

<head>
  <!-- 声明字符编码为 UTF-8，防止中文乱码 -->
  <meta charset="UTF-8">
  <title>DeepSeek 对话</title>
  <!-- 标题显示在浏览器标签页上 -->


  <style>
    /* ---------- 页面样式 ---------- */
    body {
      max-width: 800px;      /* 内容区最宽 800px，避免大屏上拉得太长 */
      margin: 30px auto;     /* 上下留 30px，水平居中 */
      font-family: sans-serif;
    }

    #log {
      /* 对话记录显示区 */
      white-space: pre-wrap;      /* 保留换行和空格（textContent 里的 \n 会正常换行显示） */
      border: 1px solid #ccc;     /* 浅灰色边框 */
      padding: 16px;              /* 内边距，让文字不贴边 */
      min-height: 200px;          /* 最小高度 200px，没内容时也不至于太扁 */
    }
    #input {
      /* 输入框 */
      width: 70%;       /* 占一行宽度的 70%，右边留给按钮 */
      height: 32px;
    }
    button {
      /* 发送按钮 */
      margin-left: 16px;  /* 和输入框之间留出间距 */
      height: 32px;
    }
  </style>
</head>                                      



<body>
  <!-- 对话记录显示区：每次对话的"我: xxx / AI: xxx"都会追加到这里 -->
  <div id="log"></div>

  <!-- 用户输入框：placeholder 是没输入内容时显示的灰色提示文字 -->
  <input id="input" style="width: 70%" placeholder="输入内容...">

  <!-- 发送按钮：点击时调用下方 script 里定义的 send() 函数 -->
  <button onclick="send()">发送</button>



  <script>
    // ---------- 核心逻辑 ----------

    // 对话历史数组：每项形如 { role: "user"|"assistant", content: "文本" }
    // 每次发消息时连同新输入一起发给后端，AI 才能记住之前聊了什么
    // 注意：只存在内存里，刷新页面就清空
    const messages = [];           // 保存对话历史（发给后端）

    /**
     * 发送消息的主函数
     * 由"发送"按钮的 onclick 和输入框的回车键触发
     */
    async function send() {
      // 获取页面上的输入框和对话显示区
      const input = document.getElementById("input");
      const log = document.getElementById("log");

      // 取出输入内容并去掉首尾空格
      const text = input.value.trim();
      if (!text) return;      // 空内容直接返回，不发请求
      input.value = "";       // 清空输入框，方便继续输入

      // 1. 把用户的话显示到对话区，并加入历史数组
      log.textContent += "我: " + text + "\n";
      messages.push({ role: "user", content: text });

      // 2. 先显示"思考中..."占位，等 AI 回来再替换掉
      log.textContent += "AI: 思考中...\n";

      try {
        // 3. 把输入和历史发给本地后端 server.js（后端再转发给 DeepSeek）
        //    history 用 slice(0, -1) 是去掉刚 push 的那条，
        //    因为后端会自己把 message 拼到 history 末尾，避免重复
        const res = await fetch("http://localhost:3001/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },   // 告诉后端发的是 JSON
          body: JSON.stringify({ message: text, history: messages.slice(0, -1) })
        });

        // 4. 解析后端返回的 JSON，格式为 { reply: "AI 回复" } 或 { error: "错误信息" }
        const data = await res.json();
        // 把末尾的 "思考中..." 替换为真实回复
        log.textContent = log.textContent.replace("AI: 思考中...", "AI: " + (data.reply || ("出错: " + data.error)));

        // 5. AI 的回复也加入历史数组，下一轮 AI 才知道自己说过什么
        if (data.reply) messages.push({ role: "assistant", content: data.reply });
      } catch (e) {
        // 请求失败（最常见原因：server.js 没启动）
        log.textContent = log.textContent.replace("AI: 思考中...", "AI: 请求失败，请确认 server.js 已启动\n");
      }
      log.textContent += "\n"; // 空一行，分隔每轮对话
    }

    // 回车发送：输入框里按 Enter 等同于点"发送"按钮
    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>

</html>
